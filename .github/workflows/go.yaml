---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Build, test, lint and audit the Go module with the organisation's
# Go workflows, and run the tests on macOS and Windows as well
name: 'Go 🐹'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  build-test:
    name: 'Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action reads PR data
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/go-workflows/.github/workflows/build-test.yaml@f474e6d3db395b6b7e8ef522f5391b4a47089060  # v0.7.1
    with:
      lint_version: 'v2.15.0'  # the version this repository already uses

  # build-test.yaml runs on Linux only; the module has OS-specific
  # code paths, so test them on macOS and Windows too. Coverage is
  # left to the Linux lane.
  cross-platform:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # Harden-runner supports Linux runners only.
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        if: runner.os == 'Linux'
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Temporary workaround: lfreleng-actions/go-test-action v0.1.2
      # calls GNU 'realpath -m', which the BSD realpath on macOS lacks.
      # Put Homebrew's GNU coreutils first on PATH until a fixed
      # release of the action exists, then remove this step.
      - name: "Use GNU coreutils (macOS)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: "Run Go tests"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/go-test-action@b609109b7be8a2bf957b47600211f35bed1c8301  # v0.1.4
        with:
          go_version_file: 'go.mod'
          race: true
          coverage: false
