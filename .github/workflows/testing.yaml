---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

# The assertions are structural: none hard-codes a matrix, a latest
# version or a snapshot date, so new releases and snapshots keep them
# passing.
jobs:
  action:
    name: "Test local GitHub Action (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Harden-runner supports Linux runners only.
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        if: runner.os == 'Linux'
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Matrix: python, detected constraint"
        id: python
        uses: $/
        with:
          tool: python
          path_prefix: testdata/action/python

      - name: "Check: python matrix"
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.python.outputs.matrix_json }}
          SUPPORTED: ${{ steps.python.outputs.supported_versions }}
          LATEST: ${{ steps.python.outputs.latest }}
          SOURCE: ${{ steps.python.outputs.versions_source }}
          REPORT: ${{ steps.python.outputs.report_path }}
        run: |
          # Check: python matrix
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # jq on Windows may end lines with CR; drop it.
          jqr() {
            local out
            out=$(jq -r "$@") || return 1
            printf '%s' "${out//$'\r'/}"
          }
          printf '%s\n' "$MATRIX_JSON"
          jq -e 'type == "object"' <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json does not parse as an object"
          keys=$(jqr -c 'keys' <<< "$MATRIX_JSON")
          [ "$keys" = '["python-version"]' ] ||
            fail "matrix_json keys are not exactly python-version"
          jq -e '.["python-version"] | length > 0 and all(
              split(".") | map(tonumber)
              | .[0] > 3 or (.[0] == 3 and .[1] >= 12))' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json holds a line below 3.12"
          last=$(jqr '.["python-version"][-1]' <<< "$MATRIX_JSON")
          [ "$LATEST" = "$last" ] || fail "latest '$LATEST' is not '$last'"
          joined=$(jqr '.["python-version"] | join(" ")' <<< "$MATRIX_JSON")
          [ "$SUPPORTED" = "$joined" ] ||
            fail "supported_versions '$SUPPORTED' is not '$joined'"
          re='^(live|cache|snapshot:[0-9]{4}-[0-9]{2}-[0-9]{2})$'
          [[ "$SOURCE" =~ $re ]] || fail "versions_source '$SOURCE'"
          report_file="${REPORT//\\//}"
          [ -f "$report_file" ] || fail "report_path '$REPORT' is not a file"
          [ "$(jqr '.tool' "$report_file")" = python ] ||
            fail "the report's tool is not python"

      - name: "Matrix: golang alias, default path_prefix"
        id: golang
        uses: $/
        with:
          tool: golang

      - name: "Check: golang matrix"
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.golang.outputs.matrix_json }}
          REPORT: ${{ steps.golang.outputs.report_path }}
        run: |
          # Check: golang matrix
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          jqr() {
            local out
            out=$(jq -r "$@") || return 1
            printf '%s' "${out//$'\r'/}"
          }
          printf '%s\n' "$MATRIX_JSON"
          [ "$(jqr -c 'keys' <<< "$MATRIX_JSON")" = '["go-version"]' ] ||
            fail "matrix_json keys are not exactly go-version"
          origin=$(jqr '.constraint.origin' "${REPORT//\\//}")
          [ "$origin" = "go.mod:go" ] ||
            fail "constraint origin '$origin' is not go.mod:go"

      # Written at run time: a package.json in the repository would
      # make the JavaScript tooling treat it as the project manifest.
      - name: "Write the node fixture"
        shell: bash
        run: |
          # Write the node fixture
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/node-fixture"
          printf '%s\n' '{"private": true, "engines": {"node": ">=24"}}' \
            > "$RUNNER_TEMP/node-fixture/package.json"

      - name: "Matrix: node alias, detected constraint"
        id: node
        uses: $/
        with:
          tool: node
          path_prefix: ${{ runner.temp }}/node-fixture

      - name: "Check: node matrix"
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.node.outputs.matrix_json }}
          LATEST: ${{ steps.node.outputs.latest }}
          REPORT: ${{ steps.node.outputs.report_path }}
        run: |
          # Check: node matrix
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          jqr() {
            local out
            out=$(jq -r "$@") || return 1
            printf '%s' "${out//$'\r'/}"
          }
          printf '%s\n' "$MATRIX_JSON"
          [ "$(jqr -c 'keys' <<< "$MATRIX_JSON")" = '["node-version"]' ] ||
            fail "matrix_json keys are not exactly node-version"
          jq -e '.["node-version"] | length > 0 and all(test("^[0-9]+$"))' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json is empty or holds a line that is not a major"
          jq -e '.["node-version"] | all(tonumber >= 24)' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json holds a line below 24"
          last=$(jqr '.["node-version"][-1]' <<< "$MATRIX_JSON")
          [ "$LATEST" = "$last" ] || fail "latest '$LATEST' is not '$last'"
          report_file="${REPORT//\\//}"
          [ "$(jqr '.tool' "$report_file")" = nodejs ] ||
            fail "the report's tool is not nodejs"
          origin=$(jqr '.constraint.origin' "$report_file")
          [ "$origin" = "package.json:engines.node" ] ||
            fail "constraint origin '$origin' is not package.json:engines.node"

      # Written at run time: a pom.xml in the repository would make
      # the Java tooling and dependency scanners treat it as a project.
      - name: "Write the java fixture"
        shell: bash
        run: |
          # Write the java fixture
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/java-fixture"
          cat > "$RUNNER_TEMP/java-fixture/pom.xml" << 'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <properties>
              <java.version>17</java.version>
              <maven.compiler.release>${java.version}</maven.compiler.release>
            </properties>
          </project>
          EOF

      - name: "Matrix: jdk alias, detected constraint"
        id: java
        uses: $/
        with:
          tool: jdk
          path_prefix: ${{ runner.temp }}/java-fixture

      - name: "Check: java matrix"
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.java.outputs.matrix_json }}
          LATEST: ${{ steps.java.outputs.latest }}
          REPORT: ${{ steps.java.outputs.report_path }}
        run: |
          # Check: java matrix
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          jqr() {
            local out
            out=$(jq -r "$@") || return 1
            printf '%s' "${out//$'\r'/}"
          }
          printf '%s\n' "$MATRIX_JSON"
          [ "$(jqr -c 'keys' <<< "$MATRIX_JSON")" = '["java-version"]' ] ||
            fail "matrix_json keys are not exactly java-version"
          jq -e '.["java-version"] | length > 0 and all(test("^[0-9]+$"))' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json is empty or holds a line that is not a major"
          jq -e '.["java-version"] | all(tonumber >= 17)' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json holds a line below 17"
          last=$(jqr '.["java-version"][-1]' <<< "$MATRIX_JSON")
          [ "$LATEST" = "$last" ] || fail "latest '$LATEST' is not '$last'"
          report_file="${REPORT//\\//}"
          [ "$(jqr '.tool' "$report_file")" = java ] ||
            fail "the report's tool is not java"
          origin=$(jqr '.constraint.origin' "$report_file")
          want="pom.xml:/project/properties/maven.compiler.release"
          [ "$origin" = "$want" ] ||
            fail "constraint origin '$origin' is not $want"

      - name: "Check: java 11"
        id: java-check
        uses: $/
        with:
          tool: java
          mode: check
          version: '11'

      - name: "Check: java 11 outputs"
        shell: bash
        env:
          SUPPORTED: ${{ steps.java-check.outputs.supported }}
          EXCLUDED: ${{ steps.java-check.outputs.policy_excluded }}
        run: |
          # Check: java 11 outputs
          set -euo pipefail
          # Java 11 is supported upstream but below the floor of 17.
          if [ "$SUPPORTED" != false ] || [ "$EXCLUDED" != true ]; then
            echo "::error::supported=$SUPPORTED policy_excluded=$EXCLUDED"
            exit 1
          fi

      - name: "Write the maven fixture"
        shell: bash
        run: |
          # Write the maven fixture
          set -euo pipefail
          dir="$RUNNER_TEMP/maven-fixture/.mvn/wrapper"
          mkdir -p "$dir"
          base="https\\://repo.maven.apache.org/maven2/org/apache/maven"
          printf 'distributionUrl=%s/apache-maven/3.9.6/%s\n' \
            "$base" "apache-maven-3.9.6-bin.zip" \
            > "$dir/maven-wrapper.properties"
          cat "$dir/maven-wrapper.properties"

      - name: "Matrix: mvn alias, detected constraint"
        id: maven
        uses: $/
        with:
          tool: mvn
          path_prefix: ${{ runner.temp }}/maven-fixture

      - name: "Check: maven matrix"
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.maven.outputs.matrix_json }}
          LATEST: ${{ steps.maven.outputs.latest }}
          REPORT: ${{ steps.maven.outputs.report_path }}
        run: |
          # Check: maven matrix
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          jqr() {
            local out
            out=$(jq -r "$@") || return 1
            printf '%s' "${out//$'\r'/}"
          }
          printf '%s\n' "$MATRIX_JSON"
          [ "$(jqr -c 'keys' <<< "$MATRIX_JSON")" = '["maven-version"]' ] ||
            fail "matrix_json keys are not exactly maven-version"
          jq -e '.["maven-version"] | length > 0 and
            all(test("^[0-9]+\\.[0-9]+$"))' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json is empty or holds a line that is not major.minor"
          # The wrapper names 3.9.6, which keeps 3.9 and newer.
          jq -e '.["maven-version"] |
            all(split(".") | map(tonumber) >= [3, 9])' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json holds a line below 3.9"
          last=$(jqr '.["maven-version"][-1]' <<< "$MATRIX_JSON")
          [ "$LATEST" = "$last" ] || fail "latest '$LATEST' is not '$last'"
          report_file="${REPORT//\\//}"
          [ "$(jqr '.tool' "$report_file")" = maven ] ||
            fail "the report's tool is not maven"
          origin=$(jqr '.constraint.origin' "$report_file")
          want=".mvn/wrapper/maven-wrapper.properties"
          [ "$origin" = "$want" ] ||
            fail "constraint origin '$origin' is not $want"

      - name: "Write the gradle fixture"
        shell: bash
        run: |
          # Write the gradle fixture
          set -euo pipefail
          dir="$RUNNER_TEMP/gradle-fixture/gradle/wrapper"
          mkdir -p "$dir"
          base="https\\://services.gradle.org/distributions"
          printf 'distributionUrl=%s/%s\n' \
            "$base" "gradle-8.14.3-bin.zip" \
            > "$dir/gradle-wrapper.properties"
          cat "$dir/gradle-wrapper.properties"

      - name: "Matrix: gradle, detected constraint"
        id: gradle
        uses: $/
        with:
          tool: gradle
          path_prefix: ${{ runner.temp }}/gradle-fixture

      - name: "Check: gradle matrix"
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.gradle.outputs.matrix_json }}
          LATEST: ${{ steps.gradle.outputs.latest }}
          REPORT: ${{ steps.gradle.outputs.report_path }}
        run: |
          # Check: gradle matrix
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          jqr() {
            local out
            out=$(jq -r "$@") || return 1
            printf '%s' "${out//$'\r'/}"
          }
          printf '%s\n' "$MATRIX_JSON"
          [ "$(jqr -c 'keys' <<< "$MATRIX_JSON")" = '["gradle-version"]' ] ||
            fail "matrix_json keys are not exactly gradle-version"
          jq -e '.["gradle-version"] | length > 0 and
            all(test("^[0-9]+$"))' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json is empty or holds a line that is not a bare major"
          # The wrapper names 8.14.3, which keeps 8 and newer.
          jq -e '.["gradle-version"] | all(tonumber >= 8)' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json holds a line below 8"
          last=$(jqr '.["gradle-version"][-1]' <<< "$MATRIX_JSON")
          [ "$LATEST" = "$last" ] || fail "latest '$LATEST' is not '$last'"
          report_file="${REPORT//\\//}"
          [ "$(jqr '.tool' "$report_file")" = gradle ] ||
            fail "the report's tool is not gradle"
          origin=$(jqr '.constraint.origin' "$report_file")
          want="gradle/wrapper/gradle-wrapper.properties"
          [ "$origin" = "$want" ] ||
            fail "constraint origin '$origin' is not $want"
          jq -e '[.lines[] | select(.in_matrix)] |
            any(.compatibility.java.max // "" | test("^[0-9]+$")) and
            any(.checksum_url // "" |
              startswith("https://services.gradle.org/"))' \
            "$report_file" > /dev/null ||
            fail "no matrix line names its Java compatibility and checksum"

      - name: "Write the rust fixture"
        shell: bash
        run: |
          # Write the rust fixture
          set -euo pipefail
          dir="$RUNNER_TEMP/rust-fixture"
          mkdir -p "$dir"
          printf '[package]\nname = "fixture"\nrust-version = "%s"\n' \
            "1.80" > "$dir/Cargo.toml"
          cat "$dir/Cargo.toml"

      - name: "Matrix: rust, detected constraint"
        id: rust
        uses: $/
        with:
          tool: rust
          path_prefix: ${{ runner.temp }}/rust-fixture

      - name: "Check: rust matrix"
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.rust.outputs.matrix_json }}
          SUPPORTED: ${{ steps.rust.outputs.supported_versions }}
          LATEST: ${{ steps.rust.outputs.latest }}
          REPORT: ${{ steps.rust.outputs.report_path }}
        run: |
          # Check: rust matrix
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          jqr() {
            local out
            out=$(jq -r "$@") || return 1
            printf '%s' "${out//$'\r'/}"
          }
          printf '%s\n' "$MATRIX_JSON"
          [ "$(jqr -c 'keys' <<< "$MATRIX_JSON")" = '["rust-version"]' ] ||
            fail "matrix_json keys are not exactly rust-version"
          # Six numeric lines, then the stable label.
          jq -e '.["rust-version"] | length == 7 and .[-1] == "stable" and
            (.[:-1] | all(test("^[0-9]+\\.[0-9]+$")))' \
            <<< "$MATRIX_JSON" > /dev/null ||
            fail "matrix_json is not six major.minor lines and then stable"
          last=$(jqr '.["rust-version"][-2]' <<< "$MATRIX_JSON")
          [ "$LATEST" = "$last" ] || fail "latest '$LATEST' is not '$last'"
          want=$(jqr '.["rust-version"][:-1] | join(" ")' <<< "$MATRIX_JSON")
          [ "${SUPPORTED//$'\r'/}" = "$want" ] ||
            fail "supported_versions '$SUPPORTED' is not '$want'"
          report_file="${REPORT//\\//}"
          [ "$(jqr '.tool' "$report_file")" = rust ] ||
            fail "the report's tool is not rust"
          origin=$(jqr '.constraint.origin' "$report_file")
          want="Cargo.toml:package.rust-version"
          [ "$origin" = "$want" ] ||
            fail "constraint origin '$origin' is not $want"

      - name: "Matrix: python, matrix_key"
        id: key
        uses: $/
        with:
          tool: python
          matrix_key: python

      - name: "Check: matrix_key"
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.key.outputs.matrix_json }}
        run: |
          # Check: matrix_key
          set -euo pipefail
          keys=$(jq -c 'keys' <<< "$MATRIX_JSON")
          keys="${keys//$'\r'/}"
          if [ "$keys" != '["python"]' ]; then
            echo "::error::matrix_json keys are $keys, not python"
            exit 1
          fi

      - name: "Check: python 3.10"
        id: check
        uses: $/
        with:
          tool: python
          mode: check
          version: '3.10'

      - name: "Check: python 3.10 outputs"
        shell: bash
        env:
          SUPPORTED: ${{ steps.check.outputs.supported }}
          STATUS: ${{ steps.check.outputs.status }}
          EOL_DATE: ${{ steps.check.outputs.eol_date }}
        run: |
          # Check: python 3.10 outputs
          set -euo pipefail
          # Python 3.10 reached end-of-life on 2026-10-01.
          if [ "$SUPPORTED" != false ] || [ "$STATUS" != eol ] ||
            [ -z "$EOL_DATE" ]; then
            echo "::error::supported=$SUPPORTED status=$STATUS" \
              "eol_date=$EOL_DATE"
            exit 1
          fi

      - name: "Check: python 3.10, fail_on_unsupported"
        id: check-fail
        continue-on-error: true
        uses: $/
        with:
          tool: python
          mode: check
          version: '3.10'
          fail_on_unsupported: 'true'

      - name: "List: go"
        uses: $/
        with:
          tool: go
          mode: list

      - name: "Invalid: mode"
        id: bad-mode
        continue-on-error: true
        uses: $/
        with:
          tool: python
          mode: bogus

      - name: "Invalid: version in matrix mode"
        id: bad-version
        continue-on-error: true
        uses: $/
        with:
          tool: python
          version: '3.12'

      - name: "Invalid: network_timeout"
        id: bad-timeout
        continue-on-error: true
        uses: $/
        with:
          tool: python
          network_timeout: abc

      - name: "Invalid: offline_mode"
        id: bad-offline
        continue-on-error: true
        uses: $/
        with:
          tool: python
          offline_mode: 'yes'

      - name: "Invalid: matrix_key"
        id: bad-key
        continue-on-error: true
        uses: $/
        with:
          tool: python
          matrix_key: '1x'

      - name: "Invalid: eol_behaviour"
        id: bad-eol
        continue-on-error: true
        uses: $/
        with:
          tool: python
          eol_behaviour: bogus

      - name: "Invalid: tool"
        id: bad-tool
        continue-on-error: true
        uses: $/
        with:
          tool: no-such-tool

      - name: "Invalid: path_prefix"
        id: bad-path
        continue-on-error: true
        uses: $/
        with:
          tool: python
          path_prefix: does/not/exist

      - name: "Check: the expected failures failed"
        shell: bash
        env:
          CHECK_FAIL: ${{ steps.check-fail.outcome }}
          BAD_MODE: ${{ steps.bad-mode.outcome }}
          BAD_VERSION: ${{ steps.bad-version.outcome }}
          BAD_TIMEOUT: ${{ steps.bad-timeout.outcome }}
          BAD_OFFLINE: ${{ steps.bad-offline.outcome }}
          BAD_KEY: ${{ steps.bad-key.outcome }}
          BAD_EOL: ${{ steps.bad-eol.outcome }}
          BAD_TOOL: ${{ steps.bad-tool.outcome }}
          BAD_PATH: ${{ steps.bad-path.outcome }}
        run: |
          # Check: the expected failures failed
          status=0
          for pair in "fail_on_unsupported=$CHECK_FAIL" "mode=$BAD_MODE" \
            "version=$BAD_VERSION" "network_timeout=$BAD_TIMEOUT" \
            "offline_mode=$BAD_OFFLINE" "matrix_key=$BAD_KEY" \
            "eol_behaviour=$BAD_EOL" "tool=$BAD_TOOL" \
            "path_prefix=$BAD_PATH"; do
            if [ "${pair#*=}" != failure ]; then
              echo "::error::${pair%%=*}: outcome '${pair#*=}', want failure"
              status=1
            fi
          done
          exit "$status"

  offline:
    name: "Test offline mode"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        if: runner.os == 'Linux'
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: 'Harden runner (block)'
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Matrix: python, offline"
        id: offline
        uses: $/
        with:
          tool: python
          offline_mode: 'true'

      - name: "Check: the snapshot answered"
        shell: bash
        env:
          SOURCE: ${{ steps.offline.outputs.versions_source }}
        run: |
          # Check: the snapshot answered
          case "$SOURCE" in
            snapshot:*) echo "versions_source: $SOURCE" ;;
            *) echo "::error::versions_source '$SOURCE', want snapshot:*"
              exit 1 ;;
          esac

  # Prove the stale-if-error and snapshot fallback: with every request
  # sent to a dead proxy and an empty cache, the snapshot answers.
  network-down:
    name: "Test with the network down"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        if: runner.os == 'Linux'
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: 'Harden runner (block)'
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Warms the Go module and toolchain caches, so the next build
      # needs no network.
      - name: "Matrix: python, network up"
        uses: $/
        with:
          tool: python

      - name: "Matrix: python, network down"
        id: down
        uses: $/
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
          SUPPORTED_VERSIONS_CACHE_DIR: ${{ runner.temp }}/empty-cache
        with:
          tool: python
          network_timeout: '2'
          max_retries: '0'

      - name: "Check: the snapshot answered"
        shell: bash
        env:
          SOURCE: ${{ steps.down.outputs.versions_source }}
        run: |
          # Check: the snapshot answered
          case "$SOURCE" in
            snapshot:*) echo "versions_source: $SOURCE" ;;
            *) echo "::error::versions_source '$SOURCE', want snapshot:*"
              exit 1 ;;
          esac

  # Design section 9: the block-mode job. The runner cache under
  # RUNNER_TEMP starts empty, so the first run fetches live facts and
  # the second is served from the cache.
  egress-block:
    name: "Test under egress block"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Matrix: python, first run"
        id: first
        uses: $/
        with:
          tool: python

      - name: "Matrix: python, second run"
        id: second
        uses: $/
        with:
          tool: python

      - name: "Check: live, then cache"
        shell: bash
        env:
          FIRST: ${{ steps.first.outputs.versions_source }}
          SECOND: ${{ steps.second.outputs.versions_source }}
        run: |
          # Check: live, then cache
          echo "first: $FIRST; second: $SECOND"
          if [ "$FIRST" != live ] || [ "$SECOND" != cache ]; then
            echo "::error::versions_source: want live, then cache"
            exit 1
          fi
