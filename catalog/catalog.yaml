---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# The tool catalog: every tool is defined once, here. It holds policy
# (floors, ceilings, rules) and where release facts come from; the
# facts themselves are fetched at run time. schema/catalog.schema.json
# defines the format and pkg/catalog applies the checks a schema cannot
# express.

schema: 1

tools:
  python:
    name: Python
    aliases: [cpython, python3, py]
    version_scheme: major.minor
    matrix_key: python-version
    sources:
      - {type: endoflife, product: python}
      - {type: actions-manifest, repository: actions/python-versions}
    constraints:
      syntax: pep440
      detect:
        - {file: pyproject.toml, field: project.requires-python}
        - {file: pyproject.toml, field: tool.poetry.dependencies.python}
        - file: pyproject.toml
          classifiers: "Programming Language :: Python :: {line}"
        - {file: setup.cfg, field: options.python_requires}
        - {file: setup.py, regex: 'python_requires\s*=\s*["'']([^"'']+)["'']'}
        - {file: .python-version}
    policy:
      rule: all
      floor: "3.11"
      admit: installable
      prerelease: false
      eol_behaviour: warn
      warn_days_before_eol: 90

  go:
    name: Go
    aliases: [golang]
    version_scheme: major.minor
    matrix_key: go-version
    sources:
      - {type: endoflife, product: go}
      - {type: actions-manifest, repository: actions/go-versions}
    constraints:
      syntax: go-directive
      detect:
        - {file: go.mod, directive: go}
        - {file: go.mod, directive: toolchain}
    policy:
      rule: all
      admit: installable

  nodejs:
    name: Node.js
    aliases: [node]
    version_scheme: major
    matrix_key: node-version
    sources:
      - {type: endoflife, product: nodejs}
      - {type: actions-manifest, repository: actions/node-versions}
    constraints:
      syntax: semver-range
      detect:
        - {file: package.json, field: engines.node}
        - {file: .nvmrc}
        - {file: .node-version}
    policy:
      rule: lts
      current: false
      admit: installable

  java:
    name: Java (Eclipse Temurin)
    aliases: [jdk, temurin, openjdk]
    version_scheme: major
    matrix_key: java-version
    sources:
      - {type: endoflife, product: eclipse-temurin}
      - {type: adoptium}
    constraints:
      syntax: java-release
      detect:
        - {file: pom.xml, xpath: /project/properties/maven.compiler.release}
        - {file: .java-version}
        - {file: .sdkmanrc, key: java}
    policy:
      rule: lts
      current: false
      floor: "17"
      admit: installable

  maven:
    name: Apache Maven
    aliases: [mvn]
    version_scheme: major.minor
    matrix_key: maven-version
    sources:
      - {type: endoflife, product: apache-maven}
      - {type: maven-metadata, artifact: "org.apache.maven:apache-maven"}
    constraints:
      syntax: maven-range
      detect:
        - file: .mvn/wrapper/maven-wrapper.properties
          # The version comes from the file name, so any mirror layout
          # matches.
          # yamllint disable-line rule:line-length
          regex: '(?m)^\s*distributionUrl\s*[=:].*/apache-maven-([0-9][^/\s]*?)-bin\.'
        - {file: pom.xml, xpath: /project/prerequisites/maven}
    policy:
      rule: all
      prerelease: false
      admit: installable

  gradle:
    name: Gradle
    version_scheme: major
    matrix_key: gradle-version
    sources:
      - {type: endoflife, product: gradle}
      - {type: gradle-services}
    constraints:
      # No syntax: the wrapper pins one release, read as that line or
      # newer.
      detect:
        - file: gradle/wrapper/gradle-wrapper.properties
          # The version comes from the file name, so any mirror layout
          # matches; a pre-release's suffix is left out.
          # yamllint disable-line rule:line-length
          regex: '(?m)^\s*distributionUrl\s*[=:].*/gradle-([0-9]+(?:\.[0-9]+)*)[^/\s]*-(?:bin|all)\.zip'
    policy:
      rule: all
      admit: installable
    # The newest Java line each Gradle line runs on, from Gradle's
    # compatibility matrix:
    # https://docs.gradle.org/current/userguide/compatibility.html
    compatibility:
      java:
        "8": {max: "24"}
        "9": {max: "27"}

  rust:
    name: Rust
    version_scheme: major.minor
    matrix_key: rust-version
    sources:
      - {type: endoflife, product: rust}
      # The release the stable channel serves: its line and every
      # older one are installable.
      - {type: rust-channel}
    constraints:
      syntax: semver-min
      detect:
        - {file: Cargo.toml, field: package.rust-version}
        - {file: rust-toolchain.toml, field: toolchain.channel}
    policy:
      rule: latest
      count: 6
      # Appended to the matrix after the lines, for a job on whatever
      # stable is when it runs.
      labels: [stable]
      # Upstream supports only the newest line, so the older five are
      # end of life by design and stay in the matrix without warnings.
      eol_behaviour: allow

  dotnet:
    name: .NET
    # endoflife.date names .NET 5 and later by major alone, such as 8
    # and 10, which setup-dotnet accepts; the 1.x to 3.x lines are on
    # another scheme and left out.
    version_scheme: major
    matrix_key: dotnet-version
    sources:
      # No source the module reads lists installable releases of this
      # tool or the eight below, so a line enters the matrix once
      # endoflife.date marks it released.
      - {type: endoflife, product: dotnet}
    constraints:
      syntax: semver-min
    policy:
      rule: all
      admit: released
      eol_behaviour: warn

  terraform:
    name: Terraform
    version_scheme: major.minor
    matrix_key: terraform-version
    sources:
      - {type: endoflife, product: terraform}
    constraints:
      syntax: semver-min
    policy:
      # endoflife.date marks each line end of life once two newer lines
      # are out, so rule all keeps the supported lines alone.
      rule: all
      admit: released
      eol_behaviour: warn

  ruby:
    name: Ruby
    version_scheme: major.minor
    matrix_key: ruby-version
    sources:
      - {type: endoflife, product: ruby}
    constraints:
      syntax: semver-min
    policy:
      rule: all
      admit: released
      eol_behaviour: warn

  php:
    name: PHP
    version_scheme: major.minor
    matrix_key: php-version
    sources:
      - {type: endoflife, product: php}
    constraints:
      syntax: semver-min
    policy:
      rule: all
      admit: released
      eol_behaviour: warn

  elixir:
    name: Elixir
    version_scheme: major.minor
    matrix_key: elixir-version
    sources:
      - {type: endoflife, product: elixir}
    constraints:
      syntax: semver-min
    policy:
      rule: all
      admit: released
      eol_behaviour: warn

  ghc:
    name: Haskell (GHC)
    aliases: [haskell]
    version_scheme: major.minor
    matrix_key: ghc-version
    sources:
      - {type: endoflife, product: ghc}
    constraints:
      syntax: semver-min
    policy:
      rule: all
      admit: released
      eol_behaviour: warn

  julia:
    name: Julia
    version_scheme: major.minor
    matrix_key: julia-version
    sources:
      - {type: endoflife, product: julia}
    constraints:
      syntax: semver-min
    policy:
      rule: all
      admit: released
      eol_behaviour: warn

  scala:
    name: Scala
    version_scheme: major.minor
    matrix_key: scala-version
    sources:
      - {type: endoflife, product: scala}
    constraints:
      syntax: semver-min
    policy:
      # endoflife.date marks no Scala 2 line end of life, so 2.10 to
      # 2.13 stay in the matrix beside the supported Scala 3 lines. No
      # floor: under rule all a floor keeps every end-of-life Scala 3
      # line above it. A project's own minimum, passed as the
      # constraint, drops the Scala 2 lines it does not build on.
      rule: all
      admit: released
      eol_behaviour: warn

  kubernetes:
    name: Kubernetes
    aliases: [k8s]
    version_scheme: major.minor
    matrix_key: kubernetes-version
    sources:
      - {type: endoflife, product: kubernetes}
    constraints:
      syntax: semver-min
    policy:
      # endoflife.date marks each minor end of life when upstream
      # maintenance ends, so rule all keeps the three maintained lines.
      rule: all
      admit: released
      eol_behaviour: warn
