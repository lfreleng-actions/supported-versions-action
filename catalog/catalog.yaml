---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# The tool catalog: every tool is defined once, here. It holds policy
# (floors, ceilings, rules) and where release facts come from; the
# facts themselves are fetched at run time. schema/catalog.schema.json
# defines the format and pkg/catalog applies the checks a schema cannot
# express.

schema: 1

tools:
  python:
    name: Python
    aliases: [cpython, python3, py]
    version_scheme: major.minor
    matrix_key: python-version
    sources:
      - {type: endoflife, product: python}
      - {type: actions-manifest, repository: actions/python-versions}
    constraints:
      syntax: pep440
      detect:
        - {file: pyproject.toml, field: project.requires-python}
        - {file: pyproject.toml, field: tool.poetry.dependencies.python}
        - file: pyproject.toml
          classifiers: "Programming Language :: Python :: {line}"
        - {file: setup.cfg, field: options.python_requires}
        - {file: setup.py, regex: 'python_requires\s*=\s*["'']([^"'']+)["'']'}
        - {file: .python-version}
    policy:
      rule: all
      floor: "3.11"
      admit: installable
      prerelease: false
      eol_behaviour: warn
      warn_days_before_eol: 90

  go:
    name: Go
    aliases: [golang]
    version_scheme: major.minor
    matrix_key: go-version
    sources:
      - {type: endoflife, product: go}
      - {type: actions-manifest, repository: actions/go-versions}
    constraints:
      syntax: go-directive
      detect:
        - {file: go.mod, directive: go}
        - {file: go.mod, directive: toolchain}
    policy:
      rule: all
      admit: installable

  nodejs:
    name: Node.js
    aliases: [node]
    version_scheme: major
    matrix_key: node-version
    sources:
      - {type: endoflife, product: nodejs}
      - {type: actions-manifest, repository: actions/node-versions}
    constraints:
      syntax: semver-range
      detect:
        - {file: package.json, field: engines.node}
        - {file: .nvmrc}
        - {file: .node-version}
    policy:
      rule: lts
      current: false
      admit: installable

  java:
    name: Java (Eclipse Temurin)
    aliases: [jdk, temurin, openjdk]
    version_scheme: major
    matrix_key: java-version
    sources:
      - {type: endoflife, product: eclipse-temurin}
      - {type: adoptium}
    constraints:
      syntax: java-release
      detect:
        - {file: pom.xml, xpath: /project/properties/maven.compiler.release}
        - {file: .java-version}
        - {file: .sdkmanrc, key: java}
    policy:
      rule: lts
      current: false
      floor: "17"
      admit: installable

  maven:
    name: Apache Maven
    aliases: [mvn]
    version_scheme: major.minor
    matrix_key: maven-version
    sources:
      - {type: endoflife, product: apache-maven}
      - {type: maven-metadata, artifact: "org.apache.maven:apache-maven"}
    constraints:
      syntax: maven-range
      detect:
        - file: .mvn/wrapper/maven-wrapper.properties
          # The version comes from the file name, so any mirror layout
          # matches.
          # yamllint disable-line rule:line-length
          regex: '(?m)^\s*distributionUrl\s*[=:].*/apache-maven-([0-9][^/\s]*?)-bin\.'
        - {file: pom.xml, xpath: /project/prerequisites/maven}
    policy:
      rule: all
      prerelease: false
      admit: installable

  gradle:
    name: Gradle
    version_scheme: major
    matrix_key: gradle-version
    sources:
      - {type: endoflife, product: gradle}
      - {type: gradle-services}
    constraints:
      # No syntax: the wrapper pins one release, read as that line or
      # newer.
      detect:
        - file: gradle/wrapper/gradle-wrapper.properties
          # The version comes from the file name, so any mirror layout
          # matches; a pre-release's suffix is left out.
          # yamllint disable-line rule:line-length
          regex: '(?m)^\s*distributionUrl\s*[=:].*/gradle-([0-9]+(?:\.[0-9]+)*)[^/\s]*-(?:bin|all)\.zip'
    policy:
      rule: all
      admit: installable
    # The newest Java line each Gradle line runs on, from Gradle's
    # compatibility matrix:
    # https://docs.gradle.org/current/userguide/compatibility.html
    compatibility:
      java:
        "8": {max: "24"}
        "9": {max: "27"}
