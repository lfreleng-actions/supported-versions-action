# Expect an error at: tools.demo.compatibility.other.1.0

schema: 1
tools:
  demo:
    name: Demo
    version_scheme: major.minor
    matrix_key: demo-version
    sources:
      - {type: endoflife, product: demo}
    policy:
      rule: all
    compatibility:
      other:
        "1.0": {}
  other:
    name: Demo
    version_scheme: major
    matrix_key: demo-version
    sources:
      - {type: endoflife, product: demo}
    policy:
      rule: all
